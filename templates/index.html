<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Monitor</title>
<style>
  :root { --bg:#070b1a; --card:rgba(18,26,52,.72); --line:rgba(120,160,255,.18); --text:#e6ecff; --dim:#8b97c4;
          --ok:#37f2a0; --warn:#ffcf4a; --bad:#ff5470; --acc:#6aa8ff; --acc2:#b36bff; }
  * { box-sizing:border-box; margin:0; }
  body { background:radial-gradient(ellipse at top,#121a3d,var(--bg) 60%); color:var(--text);
         font:14px/1.4 system-ui,sans-serif; min-height:100vh; overflow-x:hidden; }
  #bg { position:fixed; inset:0; z-index:0; }
  main { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:24px 16px 48px; }
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  h1 { font-size:26px; letter-spacing:.5px; background:linear-gradient(90deg,var(--acc),var(--acc2),var(--ok));
       background-size:200%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shift 6s linear infinite; }
  @keyframes shift { to { background-position:200% 0; } }
  .pill { padding:4px 12px; border:1px solid var(--line); border-radius:99px; color:var(--dim); background:var(--card); }
  .live { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ok); margin-right:7px;
          animation:pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(55,242,160,.7); } 100% { box-shadow:0 0 0 12px rgba(55,242,160,0); } }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; backdrop-filter:blur(8px);
          animation:rise .6s both; transition:transform .25s, border-color .25s; }
  .card:hover { transform:translateY(-4px); border-color:var(--acc); }
  @keyframes rise { from { opacity:0; transform:translateY(24px); } }
  .card h2 { font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); margin-bottom:12px;
             display:flex; justify-content:space-between; }
  .gauge { position:relative; width:130px; height:130px; margin:0 auto 8px; }
  .gauge svg { transform:rotate(-90deg); }
  .gauge circle { fill:none; stroke-width:10; stroke-linecap:round; }
  .gauge .track { stroke:rgba(255,255,255,.07); }
  .gauge .val { transition:stroke-dashoffset .9s cubic-bezier(.2,.9,.3,1), stroke .5s; filter:drop-shadow(0 0 6px currentColor); }
  .gauge .num { position:absolute; inset:0; display:grid; place-items:center; font-size:26px; font-weight:700; }
  .sub { text-align:center; color:var(--dim); font-size:12px; }
  .spark { width:100%; height:44px; margin-top:10px; }
  .big { font-size:34px; font-weight:700; text-align:center; margin:6px 0; }
  .therm { height:12px; border-radius:6px; background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad)); position:relative; margin-top:12px; }
  .therm i { position:absolute; top:-4px; width:4px; height:20px; background:#fff; border-radius:2px; transition:left .9s; box-shadow:0 0 8px #fff; }
  .bat { width:110px; height:44px; border:3px solid var(--text); border-radius:8px; margin:10px auto; position:relative; }
  .bat::after { content:""; position:absolute; right:-9px; top:12px; width:6px; height:14px; background:var(--text); border-radius:0 3px 3px 0; }
  .bat i { display:block; height:100%; border-radius:3px; transition:width .9s, background .5s;
           background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); background-size:50% 100%;
           background-repeat:no-repeat; animation:charge 2s linear infinite; }
  .bat.idle i { animation:none; }
  @keyframes charge { from { background-position:-100% 0; } to { background-position:200% 0; } }
  .wide { grid-column:1/-1; }
  .two { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; margin-top:16px; }
  ul { list-style:none; padding:0; }
  li { padding:6px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; animation:slide .4s both; }
  li:last-child { border:0; }
  @keyframes slide { from { opacity:0; transform:translateX(-20px); } }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; }
  .on { background:var(--ok); animation:pulse 1.4s infinite; } .off { background:var(--bad); }
  .tag { font-size:11px; padding:1px 8px; border-radius:6px; font-weight:600; }
  .auto { background:rgba(179,107,255,.2); color:var(--acc2); } .web { background:rgba(106,168,255,.2); color:var(--acc); }
  .s2 { color:var(--ok); } .s4 { color:var(--warn); } .s5 { color:var(--bad); }
  .mono { font-family:ui-monospace,monospace; font-size:12.5px; }
  .dim { color:var(--dim); }
  .feed { max-height:340px; overflow:auto; }
  .counts { display:flex; gap:20px; margin-bottom:8px; }
  .counts b { font-size:22px; display:block; }
  .empty { color:var(--dim); padding:12px 0; text-align:center; }
  .cores { display:flex; gap:3px; align-items:flex-end; height:34px; margin-top:10px; }
  .cores i { flex:1; background:var(--acc); border-radius:2px; transition:height .8s, background .5s; min-height:2px; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
  <header>
    <h1>⚡ SERVER MONITOR</h1>
    <span class="pill"><span class="live"></span><span id="host">connecting…</span></span>
    <span class="pill">⏱ up <span id="uptime">–</span></span>
    <span class="pill" id="clock">–</span>
  </header>

  <div class="grid">
    <div class="card"><h2>CPU <span id="cpu-freq"></span></h2>
      <div class="gauge" data-g="cpu"></div><div class="sub" id="cpu-sub"></div>
      <div class="cores" id="cores"></div><svg class="spark" id="sp-cpu"></svg></div>
    <div class="card"><h2>Memory</h2>
      <div class="gauge" data-g="ram"></div><div class="sub" id="ram-sub"></div><svg class="spark" id="sp-ram"></svg></div>
    <div class="card"><h2>Storage</h2>
      <div class="gauge" data-g="disk"></div><div class="sub" id="disk-sub"></div></div>
    <div class="card"><h2>Temperature</h2>
      <div class="big" id="temp">–</div>
      <div class="therm"><i id="therm"></i></div><svg class="spark" id="sp-temp"></svg></div>
    <div class="card"><h2>Battery</h2>
      <div class="big" id="bat-pct">–</div>
      <div class="bat" id="bat"><i></i></div><div class="sub" id="bat-sub"></div></div>
    <div class="card"><h2>Watched processes</h2><ul id="watched"></ul></div>
  </div>

  <div class="two">
    <div class="card"><h2>Connected devices <span id="dev-count"></span></h2><ul id="devices"></ul></div>
    <div class="card"><h2>API calls</h2>
      <div class="counts">
        <div><b id="t-total">0</b><span class="dim">total</span></div>
        <div><b id="t-auto" style="color:var(--acc2)">0</b><span class="dim">automation</span></div>
        <div><b id="t-err" style="color:var(--bad)">0</b><span class="dim">errors</span></div>
      </div>
      <div class="feed"><ul id="feed"><li class="empty">Waiting for API calls…</li></ul></div></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const R = 56, CIRC = 2 * Math.PI * R;
const colorFor = p => p < 60 ? 'var(--ok)' : p < 85 ? 'var(--warn)' : 'var(--bad)';
const fmtBytes = n => (n / 1024 ** 3).toFixed(1) + ' GB';
const fmtUp = s => { const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
                     return (d ? d+'d ' : '') + (h ? h+'h ' : '') + m + 'm ' + (s%60) + 's'; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// gauges
document.querySelectorAll('.gauge').forEach(el => {
  el.innerHTML = `<svg width="130" height="130"><circle class="track" cx="65" cy="65" r="${R}"/>
    <circle class="val" cx="65" cy="65" r="${R}" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC}"/></svg>
    <div class="num">0%</div>`;
});
const shown = {};
function setGauge(name, pct) {
  const el = document.querySelector(`[data-g=${name}]`), arc = el.querySelector('.val');
  arc.style.strokeDashoffset = CIRC * (1 - pct / 100);
  arc.style.stroke = arc.style.color = colorFor(pct);
  countTo(el.querySelector('.num'), name, pct, v => v.toFixed(0) + '%');
}
function countTo(el, key, target, fmt) {   // animated number tween
  const from = shown[key] ?? 0, t0 = performance.now();
  (function step(t) {
    const k = Math.min(1, (t - t0) / 800), v = from + (target - from) * (1 - Math.pow(1 - k, 3));
    el.textContent = fmt(v); shown[key] = v;
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function spark(id, data, max = 100) {
  const svg = $(id), w = 300, h = 44;
  if (data.length < 2) return;
  const pts = data.map((v, i) => `${(i / (data.length - 1) * w).toFixed(1)},${(h - Math.min(v, max) / max * (h - 4) - 2).toFixed(1)}`);
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`); svg.setAttribute('preserveAspectRatio', 'none');
  svg.innerHTML = `<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#6aa8ff" stop-opacity=".5"/><stop offset="1" stop-color="#6aa8ff" stop-opacity="0"/></linearGradient></defs>
    <polygon points="0,${h} ${pts.join(' ')} ${w},${h}" fill="url(#g${id})"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="#6aa8ff" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

function render(s) {
  $('host').textContent = s.hostname; $('uptime').textContent = fmtUp(s.uptime);
  setGauge('cpu', s.cpu.percent); setGauge('ram', s.ram.percent); setGauge('disk', s.storage.percent);
  $('cpu-freq').textContent = s.cpu.freq ? s.cpu.freq + ' MHz' : '';
  $('cpu-sub').textContent = `${s.cpu.cores} cores · load ${s.cpu.load.join(' / ')}`;
  $('ram-sub').textContent = `${fmtBytes(s.ram.used)} / ${fmtBytes(s.ram.total)}`;
  $('disk-sub').textContent = `${fmtBytes(s.storage.used)} / ${fmtBytes(s.storage.total)}`;
  const cores = $('cores');
  if (cores.children.length !== s.cpu.per_core.length) cores.innerHTML = s.cpu.per_core.map(() => '<i></i>').join('');
  s.cpu.per_core.forEach((p, i) => { cores.children[i].style.height = Math.max(p, 4) + '%'; cores.children[i].style.background = colorFor(p); });
  spark('sp-cpu', s.history.cpu); spark('sp-ram', s.history.ram); spark('sp-temp', s.history.temp, 110);

  const t = s.temperature;
  if (t == null) { $('temp').textContent = 'n/a'; } else {
    countTo($('temp'), 'temp', t, v => v.toFixed(1) + ' °C'); $('temp').style.color = colorFor(t / 100 * 100 * .9);
    $('therm').style.left = Math.min(100, t) + '%';
  }
  const b = s.battery;
  if (!b) { $('bat-pct').textContent = 'No battery'; $('bat').style.display = 'none'; $('bat-sub').textContent = 'AC powered'; }
  else {
    countTo($('bat-pct'), 'bat', b.percent, v => v.toFixed(0) + '%');
    const fill = $('bat').firstElementChild;
    fill.style.width = b.percent + '%';
    fill.style.backgroundColor = b.percent > 40 ? 'var(--ok)' : b.percent > 20 ? 'var(--warn)' : 'var(--bad)';
    $('bat').classList.toggle('idle', !b.plugged);
    $('bat-sub').textContent = b.plugged ? '⚡ charging / plugged in' : (b.minutes_left ? `${Math.floor(b.minutes_left/60)}h ${b.minutes_left%60}m left` : 'on battery');
  }
  $('watched').innerHTML = s.watched.length ? s.watched.map(w =>
    `<li><span><span class="dot ${w.running ? 'on' : 'off'}"></span>${esc(w.name)}</span>
     <span class="dim mono">${w.running ? `${w.count}× · ${w.cpu}% cpu · ${w.mem.toFixed(1)}% mem` : 'not running'}</span></li>`).join('')
    : '<li class="empty">Add names to watch_processes in config.json</li>';

  const usb = s.devices.usb, net = s.devices.network;
  $('dev-count').textContent = `${usb.length} USB · ${net.length} LAN`;
  $('devices').innerHTML = [...usb.map(d => `<li><span>🔌 ${esc(d)}</span></li>`),
    ...net.map(n => `<li><span>🌐 ${esc(n.ip)}</span><span class="dim mono">${esc(n.mac)}</span></li>`)].join('')
    || '<li class="empty">No devices found</li>';
}

let lastReq = 0;
function renderReqs(d) {
  countTo($('t-total'), 'tt', d.totals.total, v => Math.round(v));
  countTo($('t-auto'), 'ta', d.totals.automation, v => Math.round(v));
  countTo($('t-err'), 'te', d.totals.errors, v => Math.round(v));
  if (!d.requests.length) return;
  $('feed').innerHTML = d.requests.map(r =>
    `<li style="${r.id > lastReq ? '' : 'animation:none'}"><span><span class="tag ${r.source === 'automation' ? 'auto' : 'web'}">${r.source === 'automation' ? '⚙ AUTO' : '🌐 WEB'}</span>
     <b class="mono">${r.method}</b> <span class="mono">${esc(r.path)}</span></span>
     <span class="mono"><span class="s${String(r.status)[0]}">${r.status}</span> <span class="dim">${r.ms}ms · ${esc(r.caller)}</span></span></li>`).join('');
  lastReq = d.requests[0].id;
}

async function tick() {
  try {
    const [s, r] = await Promise.all([fetch('/api/stats').then(x => x.json()), fetch('/api/requests').then(x => x.json())]);
    render(s); renderReqs(r);
  } catch (e) { $('host').textContent = 'connection lost…'; }
  $('clock').textContent = new Date().toLocaleTimeString();
}
tick(); setInterval(tick, 2000);
setInterval(() => $('clock').textContent = new Date().toLocaleTimeString(), 1000);

// animated background: drifting particles that link up
const cv = $('bg'), ctx = cv.getContext('2d'); let pts = [];
function resize() { cv.width = innerWidth; cv.height = innerHeight;
  pts = Array.from({length: Math.min(90, innerWidth / 14)}, () => ({x: Math.random()*cv.width, y: Math.random()*cv.height,
        vx: (Math.random()-.5)*.4, vy: (Math.random()-.5)*.4})); }
addEventListener('resize', resize); resize();
(function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  for (const p of pts) {
    p.x = (p.x + p.vx + cv.width) % cv.width; p.y = (p.y + p.vy + cv.height) % cv.height;
    ctx.fillStyle = 'rgba(140,180,255,.7)'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, 7); ctx.fill();
  }
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
    if (d < 120) { ctx.strokeStyle = `rgba(106,168,255,${(1 - d / 120) * .25})`; ctx.beginPath();
      ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke(); }
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
